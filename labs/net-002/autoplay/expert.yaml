# Skenario autoplay: expert. Jalankan:
#   ../../platform/autoplay.py . autoplay/expert.yaml --capture
label: "expert: konfirmasi gejala, telusuri jalur, temukan prefix /25 di r2, satu perbaikan, verifikasi dua arah"
notes: |
  ## Alur
  1. host-a: ping 10.20.0.130 gagal, traceroute berhenti setelah r1/r2.
  2. r1: alamat dan rute ke LAN-B benar.
  3. r2: /ip address print memperlihatkan ether3 = 10.20.0.1/25 (10.20.0.0-127), padahal host-b .130.
  4. Fix tunggal di r2, lalu cek.
  5. Verifikasi dua arah dari host.

  ## Label yang diharapkan dari evaluator
  - **Correctness:** 100. **Efficiency:** 100. **Safety:** 100.
  - **Methodology:** sistematis.
steps:
  - {node: host-a, cmd: "ping -c 2 -W 1 10.20.0.130", think: 12}
  - {node: host-a, cmd: "traceroute -n -w 1 -m 4 10.20.0.130", think: 10}
  - {node: r1, cmd: "/ip route print", think: 15}
  - {node: r2, cmd: "/ip address print", think: 15}
  - {node: r2, cmd: "/ip route print", think: 12}
  - {node: r2, cmd: "/ip address set [find interface=ether3] address=10.20.0.1/24", think: 25}
  - {node: r2, cmd: "/ip address print", think: 5}
  - {node: host-a, cmd: "ping -c 3 -W 1 10.20.0.130", think: 8}
  - {node: host-b, cmd: "ping -c 3 -W 1 10.10.0.10", think: 8}
