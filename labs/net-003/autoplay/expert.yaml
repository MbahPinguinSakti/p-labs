# Skenario autoplay: expert. Jalankan:
#   ../../platform/autoplay.py . autoplay/expert.yaml --capture
label: "expert: gejala → tabel routing → neighbor OSPF macet r2-r3 → bandingkan MTU → satu perbaikan → verifikasi"
notes: |
  ## Alur
  1. host-a: ping 10.30.0.10 gagal.
  2. r1: /ip route print, rute LAN-C (10.30.0.0/24) tidak ada.
  3. r1 dan r2: /routing ospf neighbor print. r1-r2 Full, r2-r3 macet di ExStart/Exchange.
  4. r2 dan r3: /interface print, MTU ether3 di r2 = 1400, ether2 di r3 = 1500.
  5. Fix tunggal: MTU ether3 di r2 kembali 1500, tunggu neighbor Full.
  6. Verifikasi dua arah dari host.

  ## Label yang diharapkan dari evaluator
  - **Correctness:** 100. **Efficiency:** 100. **Safety:** 100.
  - **Methodology:** sistematis.
steps:
  - {node: host-a, cmd: "ping -c 2 -W 1 10.30.0.10", think: 12}
  - {node: r1, cmd: "/ip route print", think: 15}
  - {node: r1, cmd: "/routing ospf neighbor print", think: 12}
  - {node: r2, cmd: "/routing ospf neighbor print", think: 15}
  - {node: r2, cmd: "/interface print", think: 20}
  - {node: r3, cmd: "/interface print", think: 15}
  - {node: r2, cmd: "/interface ethernet set ether3 mtu=1500", think: 25}
  - {node: r2, cmd: "/routing ospf neighbor print", think: 40}
  - {node: host-a, cmd: "ping -c 3 -W 1 10.30.0.10", think: 8}
  - {node: host-b, cmd: "ping -c 3 -W 1 10.10.0.10", think: 8}
